; time_sync 配置文件（Go 版）
; 放在 timesync.exe 同目录下会自动加载；不需要可删除，或用 --config <path> 指定。
; 优先级：命令行参数 > 本配置文件 > 内置默认值

[servers]
; NTP 服务器，逗号分隔。全部失败时会自动用下面的 HTTP 源兜底
ntp = ntp.aliyun.com, ntp1.aliyun.com, ntp.tencent.com, time1.cloud.tencent.com, cn.pool.ntp.org, time.edu.cn, time.apple.com, time.cloudflare.com, time.nist.gov, pool.ntp.org, time.windows.com
; HTTP 时间兜底源（读取其响应头 Date），UDP 123 被封时生效（秒级精度，仅兜底）
http = https://www.baidu.com, https://www.qq.com, https://www.taobao.com, https://www.163.com, https://www.sina.com.cn, https://www.jd.com, https://www.microsoft.com, https://www.google.com, https://cloudflare.com

[sync]
; 单次请求超时（秒）
timeout = 5
; 偏差小于该值（秒）时不改写系统时钟，避免无谓改动
threshold = 0.5
; 是否忽略阈值强制校正：true / false
force = false
; 循环校准间隔（分钟），0 = 不循环（单次运行）。与 --loop --interval 配合
interval = 60
; 每源重试次数
retries = 2
; 校准日志文件路径，留空表示不写日志（相对路径按 exe 所在目录解析）
log = 校正日志.txt
; 平滑校时：true 时偏差在 slew_max 秒内会拆成多个小步进逼近，避免时钟突跳
slew = false
; 平滑校时适用的最大偏差（秒）；超过则仍一次性校正
slew_max = 60
